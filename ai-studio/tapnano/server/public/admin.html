<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>后台管理 - Cyber-Node Image Laboratory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { --neon-cyan:#00f5ff; --neon-magenta:#ff00ff; --neon-yellow:#ffff00; --dark-bg:#0a0a0f; --dark-surface:#14141f; --glass-bg:rgba(20,20,35,0.8); --glass-border:rgba(255,255,255,0.1); }
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',system-ui,sans-serif; }
    body { background:var(--dark-bg); color:#fff; min-height:100vh; }
    .cyber-grid { position:fixed; inset:0; pointer-events:none; z-index:0; background-image:linear-gradient(rgba(0,245,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,245,255,0.03) 1px,transparent 1px); background-size:50px 50px; }
    .glass { background:var(--glass-bg); border:1px solid var(--glass-border); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); }
    .neon-text { color:var(--neon-cyan); text-shadow:0 0 10px rgba(0,245,255,0.5); }
    .page { position:relative; z-index:1; max-width:900px; margin:0 auto; padding:30px 20px; display:none; }
    .page.active { display:block; }
    #loginPage { display:none; min-height:100vh; align-items:center; justify-content:center; flex-direction:column; }
    #loginPage.active { display:flex; }
    .tab-bar { background:var(--dark-surface); border-radius:12px; padding:4px; display:flex; gap:4px; margin-bottom:24px; border:1px solid var(--glass-border); }
    .tab-btn { flex:1; padding:12px 0; text-align:center; border-radius:8px; border:none; background:transparent; color:rgba(255,255,255,0.4); cursor:pointer; font-size:14px; font-weight:600; transition:all 0.3s; }
    .tab-btn.active { background:rgba(0,245,255,0.15); color:var(--neon-cyan); box-shadow:0 0 15px rgba(0,245,255,0.2); }
    .tab-btn:hover:not(.active) { color:rgba(255,255,255,0.6); }
    .card { padding:20px; border-radius:16px; border:1px solid var(--glass-border); background:var(--glass-bg); backdrop-filter:blur(20px); margin-bottom:20px; }
    .card h3 { font-size:14px; color:rgba(255,255,255,0.8); margin-bottom:16px; display:flex; align-items:center; gap:8px; }
    .card h3 svg { width:18px; height:18px; }
    table { width:100%; border-collapse:collapse; }
    th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:rgba(255,255,255,0.35); padding:10px 12px; border-bottom:1px solid rgba(255,255,255,0.08); }
    td { padding:12px; font-size:14px; border-bottom:1px solid rgba(255,255,255,0.04); }
    tr:hover td { background:rgba(255,255,255,0.02); }
    .btn { padding:8px 16px; border-radius:8px; border:1px solid; font-size:13px; font-weight:600; cursor:pointer; transition:all 0.3s; background:transparent; }
    .btn-cyan { color:var(--neon-cyan); border-color:rgba(0,245,255,0.4); }
    .btn-cyan:hover { background:rgba(0,245,255,0.15); box-shadow:0 0 15px rgba(0,245,255,0.3); }
    .btn-magenta { color:var(--neon-magenta); border-color:rgba(255,0,255,0.4); }
    .btn-magenta:hover { background:rgba(255,0,255,0.15); box-shadow:0 0 15px rgba(255,0,255,0.3); }
    .btn-red { color:#ff4444; border-color:rgba(255,68,68,0.4); }
    .btn-red:hover { background:rgba(255,68,68,0.15); box-shadow:0 0 15px rgba(255,68,68,0.3); }
    .btn-sm { padding:5px 12px; font-size:12px; }
    input[type="text"], input[type="password"] { width:100%; padding:10px 14px; border-radius:8px; border:1px solid rgba(255,255,255,0.1); background:rgba(0,0,0,0.3); color:#fff; font-size:14px; outline:none; transition:all 0.3s; }
    input:focus { border-color:var(--neon-cyan); box-shadow:0 0 10px rgba(0,245,255,0.2); }
    input::placeholder { color:rgba(255,255,255,0.3); }
    select { padding:10px 14px; border-radius:8px; border:1px solid rgba(255,255,255,0.1); background:rgba(0,0,0,0.3); color:#fff; font-size:14px; outline:none; }
    .toast { position:fixed; top:20px; right:20px; padding:12px 20px; border-radius:10px; font-size:14px; z-index:10000; animation:slideIn 0.3s ease; }
    .toast-success { background:rgba(0,245,255,0.15); border:1px solid rgba(0,245,255,0.3); color:var(--neon-cyan); }
    .toast-error { background:rgba(255,68,68,0.15); border:1px solid rgba(255,68,68,0.3); }
    @keyframes slideIn { from{transform:translateX(100%);opacity:0} to{transform:translateX(0);opacity:1} }
    .empty-state { text-align:center; padding:40px; color:rgba(255,255,255,0.3); font-size:14px; }
    .badge { display:inline-block; padding:2px 8px; border-radius:6px; font-size:11px; font-weight:600; }
    .badge-pending { background:rgba(255,255,0,0.15); color:#ffff00; }
    .badge-approved { background:rgba(0,245,255,0.15); color:var(--neon-cyan); }
    .badge-admin { background:rgba(255,0,255,0.15); color:var(--neon-magenta); }
    .topbar { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid rgba(255,255,255,0.06); margin-bottom:24px; }
    .topbar h1 { font-size:18px; }
    .topbar .user-info { display:flex; align-items:center; gap:12px; }
    .topbar .user-info span { color:var(--neon-cyan); font-weight:500; }
    .link-btn { color:rgba(255,255,255,0.5); text-decoration:none; font-size:14px; border-bottom:1px dashed rgba(255,255,255,0.3); transition:all 0.3s; }
    .link-btn:hover { color:var(--neon-cyan); border-color:var(--neon-cyan); }
    .action-row { display:flex; gap:6px; }
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); backdrop-filter:blur(5px); display:none; align-items:center; justify-content:center; z-index:9999; }
    .modal-overlay.active { display:flex; }
    .modal-content { max-width:400px; width:90%; }
  </style>
</head>
<body>
  <div class="cyber-grid"></div>

  <!-- 登录页 -->
  <div id="loginPage" class="page active">
    <div style="text-align:center;margin-bottom:32px;">
      <h1 class="neon-text" style="font-size:24px;margin-bottom:4px;">Cyber-Node</h1>
      <p style="color:rgba(255,255,255,0.4);font-size:13px;">管理后台</p>
    </div>
    <div class="card" style="width:100%;max-width:380px;">
      <form id="loginForm">
        <div style="margin-bottom:16px;">
          <label style="font-size:12px;color:rgba(255,255,255,0.5);display:block;margin-bottom:6px;">用户名</label>
          <input type="text" id="loginUsername" placeholder="请输入用户名" required />
        </div>
        <div style="margin-bottom:16px;">
          <label style="font-size:12px;color:rgba(255,255,255,0.5);display:block;margin-bottom:6px;">密码</label>
          <input type="password" id="loginPassword" placeholder="请输入密码" required />
        </div>
        <div id="loginError" style="display:none;margin-bottom:16px;padding:10px;border-radius:8px;background:rgba(255,68,68,0.1);border:1px solid rgba(255,68,68,0.3);color:#ff4444;font-size:13px;"></div>
        <button type="submit" id="loginBtn" style="width:100%;padding:12px;border-radius:10px;border:1px solid rgba(0,245,255,0.5);background:rgba(0,245,255,0.15);color:var(--neon-cyan);font-weight:600;font-size:14px;cursor:pointer;transition:all 0.3s;">登 录</button>
      </form>
    </div>
    <a href="/" class="link-btn" style="margin-top:24px;">返回主站</a>
  </div>

  <!-- 管理页面 -->
  <div id="dashboardPage" class="page">
    <div class="topbar">
      <h1 class="neon-text">后台管理</h1>
      <div class="user-info">
        <span id="topUsername"></span>
        <a href="/" class="link-btn">返回主站</a>
        <button onclick="logout()" class="btn btn-magenta btn-sm">退出</button>
      </div>
    </div>
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="pending" onclick="switchTab('pending')">待审批</button>
      <button class="tab-btn" data-tab="users" onclick="switchTab('users')">用户管理</button>
      <button class="tab-btn" data-tab="settings" onclick="switchTab('settings')">系统设置</button>
    </div>
    <div id="tab-pending">
      <div class="card">
        <h3>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          待审批的注册申请
        </h3>
        <div id="pendingList"></div>
      </div>
    </div>
    <div id="tab-users" style="display:none;">
      <div class="card">
        <h3>
          <svg viewBox="0 0 24 24" fill="none" stroke="var(--neon-cyan)"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/></svg>
          添加用户
        </h3>
        <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;">
          <div style="flex:1;min-width:150px;">
            <label style="font-size:11px;color:rgba(255,255,255,0.5);display:block;margin-bottom:4px;">用户名</label>
            <input type="text" id="addUsername" placeholder="用户名" />
          </div>
          <div style="flex:1;min-width:150px;">
            <label style="font-size:11px;color:rgba(255,255,255,0.5);display:block;margin-bottom:4px;">密码</label>
            <input type="text" id="addPassword" placeholder="密码" />
          </div>
          <div style="min-width:120px;">
            <label style="font-size:11px;color:rgba(255,255,255,0.5);display:block;margin-bottom:4px;">角色</label>
            <select id="addRole"><option value="user">普通用户</option><option value="admin">管理员</option></select>
          </div>
          <button onclick="addUser()" class="btn btn-cyan">添加</button>
        </div>
      </div>
      <div class="card">
        <h3>
          <svg viewBox="0 0 24 24" fill="none" stroke="var(--neon-magenta)"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
          用户列表
        </h3>
        <div id="userList"></div>
      </div>
    </div>
    <div id="tab-settings" style="display:none;">
      <div class="card">
        <h3>
          <svg viewBox="0 0 24 24" fill="none" stroke="var(--neon-cyan)"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3"/></svg>
          系统设置
        </h3>
        <div style="margin-bottom:20px;">
          <label style="display:flex;align-items:center;gap:10px;cursor:pointer;margin-bottom:16px;">
            <input type="checkbox" id="proxyMode" style="width:auto;accent-color:var(--neon-cyan);" />
            <span style="font-size:14px;">代理模式</span>
          </label>
          <label style="font-size:11px;color:rgba(255,255,255,0.5);display:block;margin-bottom:4px;">代理地址</label>
          <input type="text" id="proxyUrl" placeholder="http://host:port" />
        </div>
        <button onclick="saveSettings()" class="btn btn-cyan">保存设置</button>
      </div>
      <div class="card">
        <h3>
          <svg viewBox="0 0 24 24" fill="none" stroke="var(--neon-magenta)"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
          API Key 管理
        </h3>
        <div style="display:flex;gap:10px;margin-bottom:16px;">
          <input type="text" id="newApiKey" placeholder="输入新的 Google API Key" style="flex:1;" />
          <button onclick="addApiKey()" class="btn btn-magenta">添加</button>
        </div>
        <div id="apiKeyList"></div>
      </div>
    </div>
  </div>

  <!-- 确认弹窗 -->
  <div id="confirmModal" class="modal-overlay">
    <div class="card modal-content">
      <h3 style="margin-bottom:12px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ff4444" style="width:18px;height:18px;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.34 16.5c-.77.833.192 2.5 1.732 2.5z"/></svg>
        确认操作
      </h3>
      <p id="confirmMsg" style="color:rgba(255,255,255,0.6);margin-bottom:20px;font-size:14px;"></p>
      <div style="display:flex;gap:10px;justify-content:flex-end;">
        <button onclick="closeConfirm()" class="btn btn-cyan btn-sm">取消</button>
        <button id="confirmBtn" class="btn btn-red btn-sm">确认</button>
      </div>
    </div>
  </div>

  <script src="/admin/admin.js"></script>
</body>
</html>
