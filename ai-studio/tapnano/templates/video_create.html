<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首尾帧视频创作</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>首尾帧视频创作</h1>
            <p>上传起始帧和结束帧，AI自动生成完整视频</p>
        </div>

        <nav class="nav-tabs">
            <a href="/">文字生成</a>
            <a href="/upload">图片参考生成</a>
            <a href="/edit">图片编辑</a>
            <a href="/video-create" class="active">视频创作</a>
            <a href="/batch">批量任务</a>
            <a href="/admin">用户管理</a>
            <a href="/logout">退出登录</a>
        </nav>

        <div class="preview-section" id="preview-section" style="display: none;">
            <div class="card">
                <div class="card-header">
                    <h2>生成结果</h2>
                </div>
                <div class="card-body">
                    <div class="preview-container">
                        <div class="preview-box">
                            <div class="preview-label">生成的视频</div>
                            <video id="result-video" controls playsinline style="width: 100%; border-radius: var(--radius-sm);">
                                <source src="" type="video/mp4">
                                您的浏览器不支持视频播放
                            </video>
                        </div>
                    </div>
                    <div class="form-group" style="margin-top: 20px;">
                        <button id="download-btn" class="btn btn-primary" style="max-width: 300px;">
                            <span>下载视频</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h2>创建新视频</h2>
            </div>
            <div class="card-body">
                <div class="form-row">
                    <div class="form-group">
                        <label>起始帧上传</label>
                        <div class="frame-upload-area" id="first-frame-area">
                            <div class="frame-upload-placeholder" id="first-frame-placeholder">
                                <div class="frame-upload-icon">🖼️</div>
                                <div class="frame-upload-text">拖拽图片到这里或点击上传</div>
                                <div class="frame-upload-hint">支持 JPG、PNG、WebP，最大 10MB</div>
                            </div>
                            <div class="frame-upload-preview" id="first-frame-preview" style="display: none;">
                                <img id="first-frame-img" src="" alt="起始帧预览">
                                <button type="button" class="frame-remove-btn" id="first-frame-remove">×</button>
                            </div>
                        </div>
                        <input type="file" id="first-frame-input" accept="image/*" style="display: none;">
                    </div>

                    <div class="form-group">
                        <label>结束帧上传</label>
                        <div class="frame-upload-area" id="last-frame-area">
                            <div class="frame-upload-placeholder" id="last-frame-placeholder">
                                <div class="frame-upload-icon">🖼️</div>
                                <div class="frame-upload-text">拖拽图片到这里或点击上传</div>
                                <div class="frame-upload-hint">支持 JPG、PNG、WebP，最大 10MB</div>
                            </div>
                            <div class="frame-upload-preview" id="last-frame-preview" style="display: none;">
                                <img id="last-frame-img" src="" alt="结束帧预览">
                                <button type="button" class="frame-remove-btn" id="last-frame-remove">×</button>
                            </div>
                        </div>
                        <input type="file" id="last-frame-input" accept="image/*" style="display: none;">
                    </div>
                </div>

                <div class="form-group">
                    <label for="prompt">视频描述 (可选)</label>
                    <div class="prompt-input-wrapper">
                        <div class="prompt-input-container">
                            <textarea id="prompt" rows="3" placeholder="描述你希望生成的视频效果，如：阳光照射下的城市街道，车辆缓慢行驶..."></textarea>
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="resolution">视频分辨率</label>
                        <select id="resolution">
                            <option value="720P">720P</option>
                            <option value="1080P">1080P (高清)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="duration">视频时长</label>
                        <select id="duration">
                            <option value="3">3 秒</option>
                            <option value="5" selected>5 秒</option>
                            <option value="10">10 秒</option>
                            <option value="15">15 秒</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group" style="flex: 2;">
                        <label for="video_model">视频模型</label>
                        <select id="video_model">
                            <option value="wan2.7-i2v">万相 2.7 (高质量)</option>
                            <option value="wan2.2-kf2v-flash">万相 2.2 (快速)</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="prompt_extend" checked>
                        <span>启用Prompt智能改写（推荐，开启后生成效果更好）</span>
                    </label>
                </div>
            </div>
            <div class="card-footer">
                <button id="generate-btn" class="btn btn-primary" disabled>
                    <span>开始生成视频</span>
                </button>
                <div id="status" class="status"></div>
            </div>
        </div>

        <div class="video-progress-section" id="video-progress-section" style="display: none;">
            <div class="card">
                <div class="card-header">
                    <h2>生成进度</h2>
                </div>
                <div class="card-body">
                    <div class="video-progress-info">
                        <div class="progress-text" id="progress-text">准备中...</div>
                        <div class="progress-percentage" id="progress-percentage">0%</div>
                    </div>
                    <div class="progress-bar-container" style="margin-top: 16px;">
                        <div class="progress-bar" id="video-progress-bar" style="width: 0%;"></div>
                    </div>
                    <div id="progress-status" class="progress-status-text" style="margin-top: 12px; text-align: center; color: var(--text-secondary);">
                        正在提交任务...
                    </div>
                </div>
            </div>
        </div>

        <div class="history-section">
            <h2>视频历史</h2>
            <div id="history-grid" class="history-grid"></div>
        </div>
    </div>

    <script src="/static/video_create.js"></script>
</body>
</html>
