<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - AI 图片生成器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .admin-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .user-count {
            background: var(--bg-tertiary);
            padding: 8px 16px;
            border-radius: var(--radius);
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .user-card {
            background: var(--bg-secondary);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            font-weight: 600;
        }

        .user-details h3 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .user-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .user-role {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-left: 8px;
        }

        .user-role.admin {
            background: #fef3c7;
            color: #d97706;
        }

        .user-role.user {
            background: #dbeafe;
            color: #2563eb;
        }

        .user-actions {
            display: flex;
            gap: 12px;
        }

        .btn-danger {
            padding: 8px 16px;
            background: #fef2f2;
            color: var(--error);
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-danger:hover {
            background: #fee2e2;
        }

        .btn-danger:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .create-user-card {
            background: var(--bg-secondary);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
        }

        .create-user-card h3 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        .api-key-card {
            background: var(--bg-secondary);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
        }

        .api-key-card h3 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        .api-key-form .form-row {
            display: flex;
            gap: 16px;
            align-items: flex-end;
        }

        .api-key-form .form-group {
            margin-bottom: 0;
        }

        .api-key-form .flex-1 {
            flex: 1;
            max-width: 200px;
        }

        .api-key-form .flex-2 {
            flex: 2;
            max-width: 400px;
        }

        .api-key-form input[type="text"],
        .api-key-form input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            font-size: 1rem;
            font-family: inherit;
        }

        .api-key-list {
            margin-top: 24px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .api-key-list-header {
            background: var(--bg-tertiary);
            padding: 12px 16px;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .current-api-key-item {
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            background: #f0fdf4;
        }

        .current-api-key-item .key-name {
            font-weight: 600;
            color: var(--success);
        }

        .current-api-key-item .key-value {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-family: monospace;
        }

        .api-key-list-items {
            max-height: 300px;
            overflow-y: auto;
        }

        .api-key-item {
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            transition: background 0.2s;
        }

        .api-key-item:last-child {
            border-bottom: none;
        }

        .api-key-item:hover {
            background: var(--bg-tertiary);
        }

        .api-key-item .key-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .api-key-item .key-name {
            font-weight: 500;
            color: var(--text-primary);
        }

        .api-key-item .key-value {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: monospace;
        }

        .api-key-item .key-actions {
            display: flex;
            gap: 8px;
        }

        .btn-use {
            padding: 6px 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-use:hover {
            background: var(--primary-dark);
        }

        .btn-use.active {
            background: var(--success);
            cursor: default;
        }

        .btn-delete {
            padding: 6px 12px;
            background: #fef2f2;
            color: var(--error);
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-delete:hover {
            background: #fee2e2;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 45px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            color: var(--text-muted);
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: var(--text-secondary);
        }

        .toggle-password svg {
            width: 20px;
            height: 20px;
            display: block;
        }

        .create-form {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 16px;
            align-items: end;
        }

        .form-group {
            margin-bottom: 0;
        }

        .message {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.875rem;
            display: none;
        }

        .message.error {
            background: #fef2f2;
            color: var(--error);
            display: block;
        }

        .message.success {
            background: #ecfdf5;
            color: var(--success);
            display: block;
        }

        @media (max-width: 768px) {
            .create-form {
                grid-template-columns: 1fr;
            }

            .user-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }

            .user-actions {
                width: 100%;
            }

            .btn-danger {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>用户管理</h1>
        </div>

        <nav class="nav-tabs">
            <a href="/">图片生成</a>
            <a href="/upload">图片参考生成</a>
            <a href="/edit">图片编辑</a>
            <a href="/admin" class="active">用户管理</a>
            <a href="/logout">退出登录</a>
        </nav>

        <div class="api-key-card">
            <h3>API KEY 管理</h3>
            <form id="api-key-form" class="api-key-form">
                <div class="form-row">
                    <div class="form-group flex-1">
                        <label>API KEY 名称</label>
                        <input type="text" id="api-key-name" placeholder="给API KEY起个名字，如：主力KEY">
                    </div>
                    <div class="form-group flex-2">
                        <label>API KEY</label>
                        <div class="password-wrapper">
                            <input type="password" id="api-key-input" placeholder="输入API KEY" style="font-size: 12px; letter-spacing: 0.5px;">
                            <button type="button" class="toggle-password" id="toggleApiKey">
                                <svg id="eyeIconApi" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary" style="align-self: flex-end; padding: 12px 16px; font-size: 14px;">添加</button>
                </div>
            </form>
            <div id="api-key-message" class="message"></div>

            <div class="api-key-list">
                <div class="api-key-list-header">
                    <span>当前使用的API KEY</span>
                </div>
                <div id="current-api-key" class="current-api-key-item">
                    <span class="loading">加载中...</span>
                </div>
            </div>

            <div class="api-key-list">
                <div class="api-key-list-header">
                    <span>其他API KEY</span>
                </div>
                <div id="api-key-list-items" class="api-key-list-items"></div>
            </div>
        </div>

        <div class="create-user-card">
            <h3>创建新用户</h3>
            <form id="create-form" class="create-form">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="new-username" placeholder="输入用户名" required>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="new-password" placeholder="输入密码（至少6位）" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary">创建用户</button>
            </form>
            <div id="message" class="message"></div>
        </div>

        <div class="admin-header">
            <h2>用户列表</h2>
            <span class="user-count">共 <strong id="total-users">0</strong> 个用户</span>
        </div>

        <div id="user-list"></div>
    </div>

    <script>
        let currentUser = null;

        async function checkAuth() {
            try {
                const response = await fetch('/api/auth_status');
                const data = await response.json();

                if (!data.authenticated || data.user.role !== 'admin') {
                    window.location.href = '/';
                    return null;
                }

                currentUser = data.user;
                return currentUser;
            } catch (error) {
                window.location.href = '/login';
                return null;
            }
        }

        async function loadUsers() {
            try {
                const response = await fetch('/api/users');
                const users = await response.json();
                renderUsers(users);
            } catch (error) {
                console.error('Failed to load users:', error);
            }
        }

        function renderUsers(users) {
            const list = document.getElementById('user-list');
            document.getElementById('total-users').textContent = users.length;

            if (users.length === 0) {
                list.innerHTML = '<p style="text-align: center; color: var(--text-muted);">暂无用户</p>';
                return;
            }

            list.innerHTML = users.map(user => `
                <div class="user-card">
                    <div class="user-info">
                        <div class="user-avatar">${user.username.charAt(0).toUpperCase()}</div>
                        <div class="user-details">
                            <h3>
                                ${escapeHtml(user.username)}
                                <span class="user-role ${user.role}">${user.role === 'admin' ? '管理员' : '用户'}</span>
                            </h3>
                            <div class="user-meta">创建于 ${formatDate(user.created_at)}</div>
                        </div>
                    </div>
                    <div class="user-actions">
                        ${user.role !== 'admin' ? `
                            <button class="btn-danger" onclick="deleteUser('${user.id}')" ${user.id === currentUser?.id ? 'disabled' : ''}>
                                删除
                            </button>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        async function createUser(username, password) {
            try {
                const response = await fetch('/api/users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, role: 'user' })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showMessage('用户创建成功', 'success');
                    document.getElementById('new-username').value = '';
                    document.getElementById('new-password').value = '';
                    loadUsers();
                } else {
                    showMessage(data.error || '创建失败', 'error');
                }
            } catch (error) {
                showMessage('网络错误', 'error');
            }
        }

        async function deleteUser(userId) {
            if (!confirm('确定要删除这个用户吗？该操作不可恢复。')) {
                return;
            }

            try {
                const response = await fetch(`/api/users/${userId}`, {
                    method: 'DELETE'
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showMessage('用户已删除', 'success');
                    loadUsers();
                } else {
                    showMessage(data.error || '删除失败', 'error');
                }
            } catch (error) {
                showMessage('网络错误', 'error');
            }
        }

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message ${type}`;
            setTimeout(() => {
                msg.className = 'message';
                msg.textContent = '';
            }, 3000);
        }

        function formatDate(isoString) {
            const date = new Date(isoString);
            return date.toLocaleDateString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById('create-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('new-username').value.trim();
            const password = document.getElementById('new-password').value;
            if (username && password.length >= 6) {
                createUser(username, password);
            }
        });

        checkAuth().then(() => {
            if (currentUser) {
                loadUsers();
                loadApiKeys();
            }
        });

        async function loadApiKeys() {
            try {
                const response = await fetch('/api/api_keys');
                const data = await response.json();
                renderApiKeys(data);
            } catch (error) {
                console.error('Failed to load API keys:', error);
            }
        }

        function renderApiKeys(keys) {
            const currentContainer = document.getElementById('current-api-key');
            const listContainer = document.getElementById('api-key-list-items');

            if (!keys || keys.length === 0) {
                currentContainer.innerHTML = '<span style="color: var(--text-muted);">暂无API KEY</span>';
                listContainer.innerHTML = '';
                return;
            }

            const activeKey = keys.find(k => k.is_active);
            const otherKeys = keys.filter(k => !k.is_active);

            if (activeKey) {
                currentContainer.innerHTML = `
                    <div>
                        <span class="key-name">✓ ${escapeHtml(activeKey.name || '未命名')}</span>
                        <span class="key-value">${maskApiKey(activeKey.value)}</span>
                    </div>
                    <span style="font-size: 0.75rem; color: var(--success);">使用中</span>
                `;
            } else {
                currentContainer.innerHTML = '<span style="color: var(--text-muted);">未选择API KEY</span>';
            }

            if (otherKeys.length === 0) {
                listContainer.innerHTML = '<div style="padding: 16px; color: var(--text-muted);">暂无其他API KEY</div>';
            } else {
                listContainer.innerHTML = otherKeys.map(key => `
                    <div class="api-key-item">
                        <div class="key-info">
                            <span class="key-name">${escapeHtml(key.name || '未命名')}</span>
                            <span class="key-value">${maskApiKey(key.value)}</span>
                        </div>
                        <div class="key-actions">
                            <button class="btn-use" onclick="setActiveApiKey('${key.id}')">使用</button>
                            <button class="btn-delete" onclick="deleteApiKey('${key.id}')">删除</button>
                        </div>
                    </div>
                `).join('');
            }
        }

        function maskApiKey(key) {
            if (key.length <= 12) return '***';
            return key.substring(0, 8) + '...' + key.substring(key.length - 4);
        }

        async function addApiKey(name, value) {
            try {
                const response = await fetch('/api/api_keys', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, value })
                });
                const data = await response.json();
                if (data.success) {
                    showApiKeyMessage('API KEY添加成功', 'success');
                    loadApiKeys();
                } else {
                    showApiKeyMessage(data.error || '添加失败', 'error');
                }
            } catch (error) {
                showApiKeyMessage('网络错误', 'error');
            }
        }

        async function setActiveApiKey(id) {
            try {
                const response = await fetch(`/api/api_keys/${id}/activate`, {
                    method: 'POST'
                });
                const data = await response.json();
                if (data.success) {
                    showApiKeyMessage('已切换API KEY', 'success');
                    loadApiKeys();
                } else {
                    showApiKeyMessage(data.error || '切换失败', 'error');
                }
            } catch (error) {
                showApiKeyMessage('网络错误', 'error');
            }
        }

        async function deleteApiKey(id) {
            if (!confirm('确定要删除这个API KEY吗？')) return;
            try {
                const response = await fetch(`/api/api_keys/${id}`, {
                    method: 'DELETE'
                });
                const data = await response.json();
                if (data.success) {
                    showApiKeyMessage('已删除', 'success');
                    loadApiKeys();
                } else {
                    showApiKeyMessage(data.error || '删除失败', 'error');
                }
            } catch (error) {
                showApiKeyMessage('网络错误', 'error');
            }
        }

        document.getElementById('api-key-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('api-key-name').value.trim();
            const value = document.getElementById('api-key-input').value.trim();
            if (!value) {
                showApiKeyMessage('API KEY不能为空', 'error');
                return;
            }
            addApiKey(name, value);
            document.getElementById('api-key-name').value = '';
            document.getElementById('api-key-input').value = '';
        });

        function showApiKeyMessage(text, type) {
            const msg = document.getElementById('api-key-message');
            msg.textContent = text;
            msg.className = `message ${type}`;
            setTimeout(() => {
                msg.className = 'message';
                msg.textContent = '';
            }, 3000);
        }

        document.getElementById('toggleApiKey').addEventListener('click', () => {
            const input = document.getElementById('api-key-input');
            const eyeIcon = document.getElementById('eyeIconApi');
            const type = input.type === 'password' ? 'text' : 'password';
            input.type = type;
            if (type === 'text') {
                eyeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />';
            } else {
                eyeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />';
            }
        });
    </script>
</body>
</html>
